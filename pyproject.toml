[project]
name = "ec-galvo"
version = "0.1.0"
description = "Small driver for JCZ LMC (EZCAD2-era) galvo laser boards, trimmed from MeerK40t"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyusb"]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ec_galvo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
